name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run unit tests with pytest
        run: pytest

      - name: Build Docker image
        run: docker build -t hostelops:test .

      - name: Run container detached on port 8000
        run: docker run -d --name hostelops-app -p 8000:8000 -e PORT=8000 hostelops:test

      - name: Wait for health check (up to 30 seconds)
        run: |
          timeout=30
          start_time=$(date +%s)
          while true; do
            if curl -f http://localhost:8000/health; then
              echo ""
              echo "Health check succeeded!"
              break
            fi
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -ge $timeout ]; then
              echo "Health check timed out after ${timeout} seconds"
              docker logs hostelops-app
              exit 1
            fi
            sleep 1
          done

      - name: Stop and clean up container
        if: always()
        run: |
          docker stop hostelops-app || true
          docker rm hostelops-app || true
