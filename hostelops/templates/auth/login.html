{% extends 'base.html' %}

{% block title %}Log in · HostelOps{% endblock %}

{% block content %}
<section class="auth-layout">
  <div class="card auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in to HostelOps</h1>
    <p class="muted">Sign in to manage your hostel requests.</p>
    <form method="POST" action="{{ request.full_path if request.query_string else '/login' }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New to HostelOps? <a href="/register">Create an account</a></p>
  </div>
</section>
{% endblock %}
