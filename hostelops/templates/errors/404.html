{% extends 'base.html' %}

{% block title %}Page not found · HostelOps{% endblock %}

{% block content %}
<section class="card error-card">
  <div class="empty-state-icon" style="background: #E0F2FE; color: #0284C7;">
    🔍
  </div>
  <p class="eyebrow" style="color: #0284C7;">404 · PAGE NOT FOUND</p>
  <h1>We couldn’t find that page.</h1>
  <p class="muted">The link may be outdated, mistyped, or the page may have been moved.</p>
  <div style="display: flex; justify-content: center; gap: 12px; margin-top: var(--space-4);">
    <a class="btn btn-primary" href="/complaints">Back to complaints</a>
  </div>
</section>
{% endblock %}
