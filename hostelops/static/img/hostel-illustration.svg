    <rect x="221" y="136" width="12" height="15" rx="2" transform="skewY(7)"/>
    <rect x="244" y="139" width="12" height="15" rx="2" transform="skewY(7)"/>

    <!-- Row 3 -->
    <rect x="175" y="155" width="12" height="15" rx="2" transform="skewY(7)"/>
    <rect x="198" y="158" width="12" height="15" rx="2" transform="skewY(7)"/>
