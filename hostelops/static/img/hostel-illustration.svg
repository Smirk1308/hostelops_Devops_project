  <path d="M190 75 L245 84 L245 100 L190 92 Z" fill="#9DBFE3"/>

  <!-- Left Side Windows -->
  <g fill="#4A75A5">
    <rect x="108" y="120" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="125" y="125" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="142" y="130" width="10" height="15" rx="1.5" transform="skewY(-15)"/>

    <rect x="108" y="145" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="125" y="150" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="142" y="155" width="10" height="15" rx="1.5" transform="skewY(-15)"/>

    <rect x="108" y="170" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="125" y="175" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
    <rect x="142" y="180" width="10" height="15" rx="1.5" transform="skewY(-15)"/>
  </g>

  <!-- Front Facade Windows -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Row 1 -->
    <rect x="175" y="105" width="12" height="15" rx="2" transform="skewY(7)"/>
    <rect x="198" y="108" width="12" height="15" rx="2" transform="skewY(7)"/>
    <rect x="221" y="111" width="12" height="15" rx="2" transform="skewY(7)"/>
