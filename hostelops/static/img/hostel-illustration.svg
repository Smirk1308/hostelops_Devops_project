<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Hostel illustration">
  <!-- Sky / Background subtle clouds -->
  <path d="M40 85 C55 85 65 72 80 72 C95 72 105 85 120 85 Z" fill="#E6F4FA" opacity="0.6"/>
  <path d="M260 65 C275 65 285 52 300 52 C315 52 325 65 340 65 Z" fill="#E6F4FA" opacity="0.6"/>
  
  <!-- Ground / lawn -->
  <ellipse cx="180" cy="205" rx="170" ry="25" fill="#E8F8F5"/>
  <path d="M20 200 Q180 185 340 200 L340 220 L20 220 Z" fill="#D7F3ED"/>

  <!-- Left trees -->
  <circle cx="55" cy="165" r="22" fill="#52D1BE" opacity="0.85"/>
  <circle cx="75" cy="170" r="18" fill="#19C6B4" opacity="0.9"/>
  <rect x="52" y="180" width="6" height="25" rx="3" fill="#8AA2B6"/>
  <rect x="73" y="182" width="5" height="23" rx="2.5" fill="#8AA2B6"/>

  <!-- Right trees -->
  <circle cx="310" cy="160" r="24" fill="#52D1BE" opacity="0.85"/>
  <circle cx="330" cy="168" r="17" fill="#19C6B4" opacity="0.9"/>
  <rect x="307" y="178" width="6" height="27" rx="3" fill="#8AA2B6"/>
  <rect x="328" y="180" width="5" height="25" rx="2.5" fill="#8AA2B6"/>

  <!-- Main Hostel Building (Perspective angle) -->
  <!-- Left Side Wing (perspective) -->
  <path d="M95 110 L160 85 L160 195 L95 195 Z" fill="#8BB2DC"/>
  <!-- Left Wing Roof -->
  <path d="M85 112 L160 82 L165 85 L95 113 Z" fill="#6C97C6"/>

